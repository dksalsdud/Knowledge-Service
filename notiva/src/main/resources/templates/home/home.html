<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notiva - 당신의 생각을 기록하고 어디서든 꺼내보세요</title>
    <link rel="stylesheet" th:href="@{/css/home/style.css}">
    <link rel="stylesheet" th:href="@{/css/home/animations.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" th:href="@{/home}" class="logo">Notiva</a>
            <div class="nav-links">
                <a href="#">서비스 소개</a>
                <a href="#">About</a>
                <a href="#" th:href="@{/login}">로그인</a>
                <a href="#" class="signup-btn" th:href="@{/signup}">회원가입</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content fade-in">
            <h1>당신의 생각을 기록하고<br>어디서든 꺼내보세요 💡</h1>
            <p class="hero-description">Notiva는 개인 지식 관리와 공유를 위한 서비스입니다.</p>
            <p class="hero-subtitle">공부, 프로젝트, 아이디어를 정리하세요.</p>
            <div class="buttons">
                <a th:href="@{/login}" class="btn btn-login">로그인</a>
                <a th:href="@{/signup}" class="btn btn-signup">회원가입</a>
            </div>
        </div>
    </header>

    <!-- Features Section -->
    <section class="features slide-up">
        <div class="feature-list">
            <div class="feature-card">
                <div class="feature-icon">📒</div>
                <h3>노트 관리</h3>
                <p>공부와 내용이나 모든것들 아이디어를 <br>쉽게 저장하고 창착할 수 있습니다.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>검색 & 태그</h3>
                <p>태그와 검색 기능으로 다른 노트을 <br>바로 찾아보세요.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌍</div>
                <h3>공유</h3>
                <p>노트로 공개하거나 다른 사람과 공유하여 <br>볼 수 있습니다.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 Notiva. All rights reserved.</p>
    </footer>
</body>
<script th:src="@{/js/home/home.js}"></script>
</html>
