spring: 
  datasource:
    url: "jdbc:mariadb://localhost:3306/notiva?serverTimezone=Asia/Seoul&useSSL=false"
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HikariPool
      max-lifetime: 600000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

server:
  port: 8080